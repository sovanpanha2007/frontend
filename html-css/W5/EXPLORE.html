<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXPLORE</title>
</head>
<body>
    <form>
        <h1>EXPLORE PAGE</h1>
        <label for="fname">First Name:</label><br>
        <input type="text" id="fname" name="fname" placeholder="ex.John" required><br>
        <label for="lname">Last Name:</label><br>
        <input type="text" id="lname" name="lname" placeholder="ex.Josh" required><br>
        <label for="age">Age:</label><br>
        <input type="number" id="age" name="age" required><br>
        <label for="sex">Sex:</label>
        <label for="Male">M</label>
        <input type="radio" id="sex" name="sex" value="Male" required>
        <label for="Female">F</label>
        <input type="radio" id="sex" name="sex" value="Female" required><br>
        <label for="Occupation">Occupation:</label><br>
        <input type="text" id="occupation" name="occupation" required><br><br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
