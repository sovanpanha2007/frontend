<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Form</title>
    <link rel="stylesheet" href="Practice_form.css">
    <style>
        body {
            background-color: #f4f7f6;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding: 40px 0;
            margin: 0;
        }
        .form-container {
            width: 100%;
            max-width: 600px;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            border: 1px solid #e0e0e0;
        }
        .form-header {
            background-color: #e0f2f1; /* Light teal top bar */
            color: #5d5d5d;
            padding: 20px;
            margin: 0;
            font-size: 1.5em;
            font-weight: 500;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            border-bottom: 1px solid #cfd8dc;
            text-align: center;
        }
        .account-form {
            padding: 25px 30px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 15px;
        }
        .form-group, .form-group-inline, .form-group-slider {
            display: flex;
            flex-direction: column;
        }
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        label {
            font-size: 0.9em;
            color: #555;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input:not([type="radio"]):not([type="checkbox"]):not([type="file"]), 
            select, 
            textarea {
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 4px;
                font-size: 0.8em;
                transition: border-color 0.3s, box-shadow 0.3s;
                width: 100%;
                box-sizing: border-box; 
            }
            ::placeholder {
                color: #aaa;
                font-style: italic;
            }
            input:focus, select:focus, textarea:focus {
                outline: none;
                border-color: #007bff;
                box-shadow: 0 0 0 1px #007bff;
            }
            textarea {
                resize: vertical;
            }
            .radio-group, .checkbox-group {
                display: flex;
                gap: 15px;
                margin-top: 5px;
            }
            .form-group-slider .slider-wrapper {
                display: flex;
                align-items: center;
                gap: 10px;
            }
            .income-display {
                min-width: 30px;
                text-align: center;
                font-size: 0.9em;
                color: #333;
            }
            .submit-container {
                text-align: center;
                margin-top: 20px;
            }
            .create-button {
                background-color: #007bff;
                color: #fff;
                border: none;
                padding: 12px 30px;         
                border-radius: 6px;
                font-size: 1em;
                cursor: pointer;
                transition: background-color 0.3s;
            }
            .create-button:hover {
                background-color: #0056b3;
            }
    </style>
</head>
<body>  

<div class="form-container">
    <h2 class="form-header">Create Account</h2>
    <form class="account-form">

        <div class="form-row">
            <div class="form-group">
                <label for="first-name">First name*</label>
                <input type="text" id="first-name" placeholder="enter your first name">
            </div>
            <div class="form-group">
                <label for="last-name">Last name</label>
                <input type="text" id="last-name" placeholder="enter your last name">
            </div>
        </div>

        <div class="form-group full-width">
            <label for="email">Email*</label>
            <input type="email" id="email" placeholder="enter your email">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="password">Password*</label>
                <input type="password" id="password" placeholder="enter your password">
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm Password *</label>
                <input type="password" id="confirm-password" placeholder="enter your password again">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group-inline">
                <label>Gender:</label>
                <div class="radio-group">
                    <input type="radio" id="male" name="gender" checked>
                    <label for="male">Male</label>
                    <input type="radio" id="female" name="gender">
                    <label for="female">Female</label>
                </div>
            </div>
            <div class="form-group-inline">
                <label>Hobbies</label>
                <div class="checkbox-group">
                    <input type="checkbox" id="music">
                    <label for="music">Music</label>
                    <input type="checkbox" id="sports">
                    <label for="sports">Sports</label>
                    <input type="checkbox" id="travel">
                    <label for="travel">Travel</label>
                    <input type="checkbox" id="movies">
                    <label for="movies">Movies</label>
                </div>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="source">Source of Income</label>
                <select id="source">
                    <option>Employed</option>
                    <option>Student</option>
                    <option>Self-Employed</option>
                </select>
            </div>
            <div class="form-group-slider">
                <label for="income-range">Income</label>
                <div class="slider-wrapper">
                    <input type="range" id="income-range" min="0" max="100" value="20">
                    <span class="income-display">20K</span>
                </div>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Upload Profile Picture</label>
                <input type="file">
            </div>
            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" value="18">
            </div>
        </div>

        <div class="form-group full-width">
            <label for="bio">Bio</label>
            <textarea id="bio" rows="4"></textarea>
        </div>

        <div class="submit-container">
            <button type="submit" class="create-button">Create</button>
        </div>

    </form>
</div>
</body>
</html>
